    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #121212;
            color: #18181B;
        }

        /* Aspect Ratio 16:9 for Slides */
        .slide-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            max-height: calc(100vh - 120px);
        }

        .seed-pattern {
            background-image: radial-gradient(#000000 20%, transparent 20%), radial-gradient(#000000 20%, transparent 20%);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            opacity: 0.04;
        }

        /* Custom Scrollbar for printable view */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #18181B;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFC83B;
            border-radius: 4px;
        }

        /* Print styles */
        @media print {
            body {
                background-color: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .print-slide {
                page-break-after: always;
                aspect-ratio: 16 / 9 !important;
                width: 100% !important;
                height: auto !important;
                margin-bottom: 2rem;
                box-shadow: none !important;
                border: 2px solid #000 !important;
            }
        }
    </style>

        // Render Carousel Slide
        function renderCurrentSlide() {
            const viewport = document.getElementById('slideContent');
            viewport.innerHTML = createSlideHTML(slidesData[currentSlide]);
            document.getElementById('slideIndicator').innerText = `Slide ${currentSlide + 1} / ${slidesData.length}`;

            // Update Thumbnails styling
            const thumbs = document.querySelectorAll('.thumb-btn');
            thumbs.forEach((thumb, idx) => {
                if (idx === currentSlide) {
                    thumb.classList.add('border-pf-yellow', 'bg-zinc-800');
                    thumb.classList.remove('border-zinc-700', 'bg-zinc-900');
                } else {
                    thumb.classList.remove('border-pf-yellow', 'bg-zinc-800');
                    thumb.classList.add('border-zinc-700', 'bg-zinc-900');
                }
            });
        }

        // Change Slide Logic
        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide < 0) currentSlide = 0;
            if (currentSlide >= slidesData.length) currentSlide = slidesData.length - 1;
            renderCurrentSlide();
        }

        function goToSlide(index) {
            currentSlide = index;
            renderCurrentSlide();
        }

        // Toggle View Mode (Carousel vs Print Scrollable)
        function toggleViewMode() {
            isScrollView = !isScrollView;
            const carouselView = document.getElementById('carouselView');
            const printView = document.getElementById('printView');
            const viewModeText = document.getElementById('viewModeText');

            if (isScrollView) {
                carouselView.classList.add('hidden');
                printView.classList.remove('hidden');
                viewModeText.innerText = "Carousel View";

                // Populate print view with all slides
                printView.innerHTML = slidesData.map(slide => createSlideHTML(slide, true)).join('');
            } else {
                carouselView.classList.remove('hidden');
                printView.classList.add('hidden');
                viewModeText.innerText = "Scroll View";
                renderCurrentSlide();
            }
        }

        // Keyboard Arrow Navigation
        document.addEventListener('keydown', (e) => {
            if (isScrollView) return;
            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                changeSlide(1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                changeSlide(-1);
            }
        });

        // Initialize presentation on load
        window.onload = function() {
            renderCurrentSlide();
        };
